<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de VD</title> <style>
        /* ESTILOS OPTIMIZADOS PARA MINECRAFT */
        body {
            background-color: #151515;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffca28;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 42px;
            text-shadow: 2px 2px 0px #000;
            text-align: center;
        }

        p.subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 30px;
        }

        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1600px;
        }

        .book-card {
            background-color: #252525;
            border: 3px solid #444;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .book-card:hover {
            border-color: #ffca28;
            transform: scale(1.02);
            background-color: #2a2a2a;
        }

        .book-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        .cover-preview {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 2px solid #000;
            background-color: #111; /* Fondo oscuro si no carga */
        }

        /* Mensaje de error si no carga la imagen */
        .img-error {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-size: 12px;
            padding: 10px;
        }

        .btn {
            width: 100%;
            padding: 18px 0;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: block;
            background-color: #388E3C; /* Verde Minecraft */
            color: white;
            box-shadow: 0 4px 0 #1B5E20;
            text-transform: uppercase;
        }

        .btn:active {
            box-shadow: 0 0 0 #1B5E20;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <h1>🏛️ Biblioteca de VD</h1>
    <p class="subtitle">Usa el Puntero Láser (Clic Derecho) para leer</p>

    <div id="library-container"></div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURACIÓN DE TUS LIBROS
        // ==========================================
        
        const misLibros = [
            // LIBRO 1: Formato simple (Asume que es .png)
            "Los_suenos_de_los_que_esta_hecha_la_mate",

            // LIBRO 2: EL KYBALION (Aquí estaba el error probable)
            // Si tu imagen en GitHub es JPG, usa este formato especial con llaves:
            { nombre: "Los_ocho_kybaliones_Gabriel_Silva", ext: "jpg" },
            
            // EJEMPLO: Si subes otro y es PNG, solo pon el nombre entre comillas:
            // "Nombre_Del_Nuevo_Libro",
        ];

        // ==========================================
        // 🤖 LÓGICA (No necesitas tocar esto)
        // ==========================================
        const container = document.getElementById('library-container');
        const pdfBase = `./pdf/`;
        const imgBase = `./portadas/`;

        misLibros.forEach(item => {
            let nombreArchivo = "";
            let extensionImg = "png"; // Por defecto PNG

            // Detectar si es texto simple o configuración avanzada
            if (typeof item === 'string') {
                nombreArchivo = item;
            } else {
                nombreArchivo = item.nombre;
                extensionImg = item.ext || "png";
            }

            const tituloLegible = nombreArchivo.replace(/_/g, ' ');

            const card = document.createElement('div');
            card.className = 'book-card';

            // Si la imagen falla, muestra un texto en lugar de un cuadro negro roto
            const imgHTML = `
                <img src="${imgBase}${nombreArchivo}.${extensionImg}" 
                     alt="${tituloLegible}" 
                     class="cover-preview"
                     onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'cover-preview img-error\'>Sin<br>Imagen<br>(${extensionImg})</div>'">
            `;

            card.innerHTML = `
                ${imgHTML}
                <div class="book-title">${tituloLegible}</div>
                <a href="${pdfBase}${nombreArchivo}.pdf" class="btn" target="_self">📖 LEER</a>
            `;

            container.appendChild(card);
        });
    </script>

</body>
</html>
