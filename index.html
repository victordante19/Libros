<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; }
    h1 { margin-bottom: 6px; }
    .hint { color: #444; margin-top: 0; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
    input { padding: 10px; width: min(520px, 100%); }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
    th { background: #f6f6f6; }
    img { width: 70px; height: auto; border: 1px solid #ddd; }
    .btn { display: inline-block; padding: 6px 10px; border: 1px solid #333; border-radius: 6px; text-decoration: none; color: #111; margin-right: 8px; }
    .btn:hover { background: #f0f0f0; }
    .muted { color: #666; }
    .error { color: #b00020; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Biblioteca</h1>
  <p class="hint">Se arma sola leyendo /pdf y /portadas del repo, empareja por nombre, y crea links para WebDisplays y WaterFrames.</p>

  <div class="row">
    <input id="q" placeholder="Buscar por nombre, ejemplo: kybaliones, mate..." />
    <span class="muted" id="status">Cargando lista...</span>
  </div>

  <div id="err" class="error"></div>

  <table id="tbl" style="display:none;">
    <thead>
      <tr>
        <th>Portada</th>
        <th>Documento</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
(async function () {
  // Ajusta aquí si algún día cambias usuario o repo
  const owner = "victordante19";
  const repo  = "Libros";
  const branch = "main";

  // Links “del sitio” (GitHub Pages) para abrir dentro de WebDisplays
  const pagesBase = `https://${owner}.github.io/${repo}`;

  // GitHub API para listar contenidos de carpetas
  const apiPdf = `https://api.github.com/repos/${owner}/${repo}/contents/pdf?ref=${branch}`;
  const apiCovers = `https://api.github.com/repos/${owner}/${repo}/contents/portadas?ref=${branch}`;

  const status = document.getElementById("status");
  const errBox = document.getElementById("err");
  const tbl = document.getElementById("tbl");
  const tbody = document.getElementById("tbody");
  const q = document.getElementById("q");

  function baseName(filename) {
    return filename.replace(/\.[^.]+$/, ""); // quita extensión
  }
  function pretty(name) {
    return name.replace(/_/g, " "); // Los_suenos -> Los suenos
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Error ${res.status} al consultar:\n${url}\n\n${text}`);
    }
    return res.json();
  }

  try {
    const [pdfList, coverList] = await Promise.all([fetchJson(apiPdf), fetchJson(apiCovers)]);

    // Mapas por nombre base
    const pdfMap = new Map();
    for (const f of pdfList) {
      if (f.type === "file" && f.name.toLowerCase().endsWith(".pdf")) {
        pdfMap.set(baseName(f.name), f.name);
      }
    }

    const coverMap = new Map();
    for (const f of coverList) {
      const n = f.name.toLowerCase();
      if (f.type === "file" && (n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".webp"))) {
        coverMap.set(baseName(f.name), f.name);
      }
    }

    // Unión de claves
    const keys = Array.from(new Set([...pdfMap.keys(), ...coverMap.keys()]))
      .sort((a, b) => a.localeCompare(b));

    if (keys.length === 0) {
      status.textContent = "No encontré PDFs o portadas en /pdf y /portadas.";
      return;
    }

    // Render
    function render(filterText = "") {
      const ft = filterText.trim().toLowerCase();
      tbody.innerHTML = "";

      const filtered = keys.filter(k => pretty(k).toLowerCase().includes(ft) || k.toLowerCase().includes(ft));

      for (const k of filtered) {
        const pdfFile = pdfMap.get(k);
        const coverFile = coverMap.get(k);

        const pdfUrl = pdfFile ? `${pagesBase}/pdf/${encodeURIComponent(pdfFile)}` : null;
        const coverUrl = coverFile ? `${pagesBase}/portadas/${encodeURIComponent(coverFile)}` : null;

        const tr = document.createElement("tr");

        const tdImg = document.createElement("td");
        if (coverUrl) {
          const img = document.createElement("img");
          img.src = coverUrl;
          img.alt = pretty(k);
          tdImg.appendChild(img);
        } else {
          tdImg.innerHTML = `<span class="muted">Sin portada</span>`;
        }

        const tdName = document.createElement("td");
        tdName.innerHTML = `<b>${pretty(k)}</b><br><span class="muted">${k}</span>`;

        const tdAct = document.createElement("td");
        tdAct.innerHTML = `
          ${pdfUrl ? `<a class="btn" href="${pdfUrl}" target="_blank" rel="noopener">Abrir PDF</a>` : `<span class="muted">Sin PDF</span>`}
          ${coverUrl ? `<a class="btn" href="${coverUrl}" target="_blank" rel="noopener">Ver portada</a>` : ``}
        `;

        tr.appendChild(tdImg);
        tr.appendChild(tdName);
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      }

      tbl.style.display = "";
      status.textContent = `Listo, ${filtered.length} item(s).`;
    }

    render();
    q.addEventListener("input", () => render(q.value));

  } catch (e) {
    errBox.textContent = String(e);
    status.textContent = "Falló la carga.";
  }
})();
</script>
</body>
</html>
