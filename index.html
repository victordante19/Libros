<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de VD V6.0</title>
    <style>
        /* =========================================
           ESTILOS V6.0 (HÍBRIDO + AUTOMÁTICO)
           ========================================= */
        body {
            background-color: #101010;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px; /* Espacio extra para scroll */
        }

        .version-tag {
            position: absolute;
            top: 15px;
            right: 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #555;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        h1 {
            color: #ffb300;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-size: 48px;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
        }

        p.subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        /* SEPARADORES DE CATEGORÍA */
        .category-header {
            grid-column: 1 / -1;
            background-color: #222;
            color: #ffb300;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            padding: 15px;
            margin-top: 40px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-bottom: 3px solid #ffb300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Estilo especial para la categoría automática */
        .category-auto {
            border-bottom-color: #777;
            color: #aaa;
            background-color: #1a1a1a;
        }

        .book-card {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .book-card:hover {
            border-color: #ffb300;
            transform: translateY(-5px);
            background-color: #222;
        }

        .book-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 15px 0;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            overflow: hidden;
        }

        .cover-preview {
            width: 160px;
            height: 230px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 2px solid #000;
            background-color: #050505;
        }

        .btn {
            width: 100%;
            padding: 16px 0;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: block;
            background-color: #2e7d32;
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
            text-transform: uppercase;
        }

        .btn:active {
            box-shadow: 0 0 0 #1b5e20;
            transform: translateY(5px);
        }

        /* CONTROLES DE SCROLL FLOTANTES */
        .scroll-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .scroll-btn {
            background-color: #ffb300;
            color: #000;
            border: 2px solid #b27d00;
            width: 80px;
            height: 80px;
            font-size: 40px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .scroll-btn:active {
            transform: scale(0.9);
            background-color: #ffca28;
        }
    </style>
</head>
<body>

    <div class="version-tag">V06.0 HÍBRIDO</div>
    
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="window.scrollBy({top: -300, behavior: 'smooth'})">⬆️</button>
        <button class="scroll-btn" onclick="window.scrollBy({top: 300, behavior: 'smooth'})">⬇️</button>
    </div>

    <h1>🏛️ Biblioteca de VD</h1>
    <p class="subtitle">Sistema Híbrido: Manual + Detección Automática</p>

    <div id="library-container"></div>

    <script>
        // ======================================================
        // 1️⃣ TU LISTA MANUAL (PRIORIDAD ALTA)
        // ======================================================
        // Aquí defines el orden y categorías de tus libros principales.
        // Si olvidas poner uno aquí, el sistema lo agregará al final automáticamente.
        
        const listaManual = [
            // --- CIENCIA ---
            "--- CIENCIA Y MATERIA", 
            "Los_suenos_de_los_que_esta_hecha_la_mate",

            // --- ALQUIMIA ---
            "--- ALQUIMIA Y ESOTERISMO",
            "Los ocho kybaliones_Gabriel Silva",
            
            // --- INGENIERÍA ---
            "--- INGENIERIA",
            // Agrega tus manuales aquí...
        ];

        // ======================================================
        // 2️⃣ CONFIGURACIÓN DEL REPOSITORIO (PARA AUTO-DETECCIÓN)
        // ======================================================
        const repoUsuario = "victordante19";
        const repoNombre = "Libros";
        
        // ======================================================
        // 🛡️ MOTOR V6.0 (HÍBRIDO) - NO TOCAR ABAJO
        // ======================================================
        const container = document.getElementById('library-container');
        const pdfBase = `./pdf/`;
        const imgBase = `./portadas/`;
        
        // Registro de libros ya mostrados para no repetirlos
        const librosMostrados = new Set();

        // FUNCIÓN 1: RENDERIZAR LA LISTA MANUAL
        function renderManualList() {
            listaManual.forEach(item => {
                let nombreCrudo = typeof item === 'string' ? item : item.nombre;

                // Si es Categoría
                if (nombreCrudo.startsWith("---")) {
                    crearSeparador(nombreCrudo.replace(/---/g, '').trim(), false);
                    return;
                }

                // Si es Libro
                crearTarjetaLibro(item);
                librosMostrados.add(nombreCrudo); // Marcar como "ya mostrado"
            });
        }

        // FUNCIÓN 2: BUSCAR LIBROS NUEVOS (GITHUB API)
        async function fetchNewBooks() {
            try {
                // Consulta la API de GitHub para ver qué hay en la carpeta /pdf
                const response = await fetch(`https://api.github.com/repos/${repoUsuario}/${repoNombre}/contents/pdf`);
                
                if (!response.ok) throw new Error("No se pudo conectar a GitHub API");
                
                const archivos = await response.json();
                
                // Filtrar solo PDFs
                const nuevosLibros = archivos
                    .filter(file => file.name.toLowerCase().endsWith('.pdf'))
                    .map(file => file.name.replace(/\.pdf$/i, '')) // Quitar extensión .pdf
                    .filter(nombre => !librosMostrados.has(nombre)); // Solo los que NO están en la lista manual

                // Si hay libros nuevos, crear sección automática
                if (nuevosLibros.length > 0) {
                    crearSeparador("📂 OTROS / SIN CATEGORIZAR", true);
                    nuevosLibros.forEach(nombre => {
                        crearTarjetaLibro(nombre);
                    });
                }

            } catch (error) {
                console.warn("Modo Offline o error de API: Solo se mostrará la lista manual.");
            }
        }

        // --- FUNCIONES AUXILIARES DE DIBUJO ---

        function crearSeparador(texto, esAuto) {
            const header = document.createElement('div');
            header.className = 'category-header' + (esAuto ? ' category-auto' : '');
            header.innerText = texto;
            container.appendChild(header);
        }

        function crearTarjetaLibro(item) {
            let nombreCrudo = "";
            let extImg = "png";

            if (typeof item === 'string') {
                nombreCrudo = item;
            } else {
                nombreCrudo = item.nombre;
                extImg = item.ext || "png";
            }

            const tituloVisual = nombreCrudo.replace(/_/g, ' ');
            const nombreSeguro = encodeURIComponent(nombreCrudo);
            const rutaPDF = `${pdfBase}${nombreSeguro}.pdf`;
            const rutaImgPNG = `${imgBase}${nombreSeguro}.png`;
            const rutaImgJPG = `${imgBase}${nombreSeguro}.jpg`;

            const card = document.createElement('div');
            card.className = 'book-card';

            const img = document.createElement('img');
            img.className = 'cover-preview';
            img.alt = tituloVisual;
            img.src = rutaImgPNG;
            
            // Lógica de intento de imagen (PNG -> JPG -> Placeholder)
            img.onerror = function() {
                if (this.src.includes('.png')) {
                    this.src = rutaImgJPG;
                } else {
                    this.onerror = null;
                    this.src = 'https://via.placeholder.com/160x230/333/777?text=Sin+Img';
                }
            };

            card.appendChild(img);

            const infoDiv = document.createElement('div');
            infoDiv.innerHTML = `
                <div class="book-title">${tituloVisual}</div>
                <a href="${rutaPDF}" class="btn" target="_self">📖 LEER</a>
            `;
            card.appendChild(infoDiv);

            container.appendChild(card);
        }

        // --- EJECUCIÓN MAESTRA ---
        renderManualList(); // 1. Muestra lo que tú configuraste
        fetchNewBooks();    // 2. Busca lo que olvidaste y agrégalo al final

    </script>

</body>
</html>
