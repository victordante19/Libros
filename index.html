<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de VD</title>
    <style>
        /* =========================================
           ESTILOS VISUALES (MODO OSCURO REFORZADO)
           ========================================= */
        body {
            background-color: #121212; /* Negro profundo */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffca28; /* Dorado */
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-size: 48px;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
        }

        p.subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* Rejilla responsive */
        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        /* Tarjeta de libro */
        .book-card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .book-card:hover {
            border-color: #ffca28;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 202, 40, 0.2);
        }

        /* Título del libro */
        .book-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 15px 0;
            height: 55px; /* Altura fija */
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            overflow: hidden;
        }

        /* Portada */
        .cover-preview {
            width: 160px;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 2px solid #000;
            background-color: #111;
        }

        /* Botón gigante para el láser */
        .btn {
            width: 100%;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: block;
            background-color: #2e7d32; /* Verde oscuro */
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #388e3c;
        }

        .btn:active {
            box-shadow: 0 0 0 #1b5e20;
            transform: translateY(5px);
        }
    </style>
</head>
<body>

    <h1>🏛️ Biblioteca de VD</h1>
    <p class="subtitle">Usa el Puntero Láser (Clic Derecho) para leer</p>

    <div id="library-container">
        </div>

    <script>
        // ======================================================
        // ⚙️ ZONA DE CONFIGURACIÓN (SOLO EDITA ESTO)
        // ======================================================
        // Escribe el nombre EXACTO del archivo (con espacios, mayúsculas, etc).
        // El código se encargará de "arreglarlo" para que funcione el link.
        
        const misLibros = [
            // LIBRO 1 (Ejemplo PNG simple)
            "Los_suenos_de_los_que_esta_hecha_la_mate",

            // LIBRO 2 (Ejemplo con espacios y JPG)
            // Aquí pones el nombre tal cual lo tienes en GitHub:
            { nombre: "Los ocho kybaliones Gabriel Silva", ext: "jpg" },

            // Puedes agregar más aquí abajo...
        ];

        // ======================================================
        // 🛡️ MOTOR DE BLINDAJE DE URLS (NO TOCAR)
        // ======================================================
        const container = document.getElementById('library-container');
        const pdfBase = `./pdf/`;
        const imgBase = `./portadas/`;

        misLibros.forEach(item => {
            let nombreRealArchivo = "";
            let extensionImg = "png"; // Por defecto es png

            // Detectar configuración
            if (typeof item === 'string') {
                nombreRealArchivo = item;
            } else {
                nombreRealArchivo = item.nombre;
                extensionImg = item.ext || "png";
            }

            // 1. Crear título visual (Dejamos los espacios para que se lea bonito)
            // Si tiene guiones bajos, los cambiamos por espacios solo para el título visual
            const tituloVisual = nombreRealArchivo.replace(/_/g, ' ');

            // 2. BLINDAJE DE URL (La magia técnica)
            // encodeURIComponent convierte "Gabriel Silva" en "Gabriel%20Silva" automáticamente
            // Esto permite que el navegador entienda el enlace sin romper el archivo.
            const nombreSeguro = encodeURIComponent(nombreRealArchivo);
            
            // Construir rutas finales
            const rutaImagen = `${imgBase}${nombreSeguro}.${extensionImg}`;
            const rutaPDF = `${pdfBase}${nombreSeguro}.pdf`;

            // Crear HTML
            const card = document.createElement('div');
            card.className = 'book-card';

            const imgHTML = `
                <img src="${rutaImagen}" 
                     alt="${tituloVisual}" 
                     class="cover-preview"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/160x230/333333/FFFFFF?text=Sin+Imagen';">
            `;

            card.innerHTML = `
                ${imgHTML}
                <div class="book-title">${tituloVisual}</div>
                <a href="${rutaPDF}" class="btn" target="_self">📖 LEER</a>
            `;

            container.appendChild(card);
        });
    </script>

</body>
</html>
