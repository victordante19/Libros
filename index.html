<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de VD V4.0</title>
    <style>
        /* =========================================
           ESTILOS VISUALES (MODO OSCURO V4.0)
           ========================================= */
        body {
            background-color: #101010;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Espacio extra abajo para poder hacer scroll cómodo */
            padding-bottom: 150px; 
        }

        /* ETIQUETA DE VERSIÓN */
        .version-tag {
            position: absolute;
            top: 15px;
            right: 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #555;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        h1 {
            color: #ffb300;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-size: 48px;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
        }

        p.subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        .book-card {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .book-card:hover {
            border-color: #ffb300;
            transform: translateY(-5px);
            background-color: #222;
        }

        .book-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 15px 0;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            overflow: hidden;
        }

        .cover-preview {
            width: 160px;
            height: 230px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 2px solid #000;
            background-color: #050505;
        }

        .btn {
            width: 100%;
            padding: 16px 0;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: block;
            background-color: #2e7d32;
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
            text-transform: uppercase;
        }

        .btn:active {
            box-shadow: 0 0 0 #1b5e20;
            transform: translateY(5px);
        }

        .debug-text {
            font-size: 10px;
            color: #555;
            margin-top: 5px;
            word-break: break-all;
            text-align: center;
            display: none;
        }

        /* =========================================
           NUEVO: BOTONES DE SCROLL FLOTANTES
           ========================================= */
        .scroll-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000; /* Siempre encima de todo */
        }

        .scroll-btn {
            background-color: #ffb300;
            color: #000;
            border: 2px solid #b27d00;
            width: 80px;
            height: 80px;
            font-size: 40px;
            border-radius: 50%; /* Redondos */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .scroll-btn:active {
            transform: scale(0.9);
            background-color: #ffca28;
        }

    </style>
</head>
<body>

    <div class="version-tag">V04.0</div>
    
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="window.scrollBy({top: -300, behavior: 'smooth'})">⬆️</button>
        <button class="scroll-btn" onclick="window.scrollBy({top: 300, behavior: 'smooth'})">⬇️</button>
    </div>

    <h1>🏛️ Biblioteca de VD</h1>
    <p class="subtitle">Usa las flechas amarillas para bajar y subir</p>

    <div id="library-container"></div>

    <script>
        // ======================================================
        // ⚙️ ZONA DE CONFIGURACIÓN
        // ======================================================
        
        const misLibros = [
            "Los_suenos_de_los_que_esta_hecha_la_mate",
            "Los ocho kybaliones_Gabriel Silva",
            // Agrega más libros aquí...
        ];

        // ======================================================
        // 🛡️ MOTOR V3.0 (Igual que antes)
        // ======================================================
        const container = document.getElementById('library-container');
        const pdfBase = `./pdf/`;
        const imgBase = `./portadas/`;

        misLibros.forEach(nombreCrudo => {
            const tituloVisual = nombreCrudo.replace(/_/g, ' ');
            const nombreSeguro = encodeURIComponent(nombreCrudo);
            const rutaPDF = `${pdfBase}${nombreSeguro}.pdf`;
            const rutaImgPNG = `${imgBase}${nombreSeguro}.png`;
            const rutaImgJPG = `${imgBase}${nombreSeguro}.jpg`;

            const card = document.createElement('div');
            card.className = 'book-card';

            const img = document.createElement('img');
            img.className = 'cover-preview';
            img.alt = tituloVisual;
            img.src = rutaImgPNG;

            img.onerror = function() {
                if (this.src.includes('.png')) {
                    this.src = rutaImgJPG;
                } else {
                    this.onerror = null;
                    this.src = 'https://via.placeholder.com/160x230/222/555?text=Sin+Img';
                    card.querySelector('.debug-text').style.display = 'block';
                }
            };

            card.appendChild(img);

            const infoDiv = document.createElement('div');
            infoDiv.innerHTML = `
                <div class="book-title">${tituloVisual}</div>
                <a href="${rutaPDF}" class="btn" target="_self">📖 LEER</a>
                <div class="debug-text">Archivo buscado:<br>${nombreCrudo}</div>
            `;
            card.appendChild(infoDiv);

            container.appendChild(card);
        });
    </script>

</body>
</html>
