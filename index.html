<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de VD V3.0</title>
    <style>
        /* =========================================
           ESTILOS VISUALES (MODO OSCURO V3.0)
           ========================================= */
        body {
            background-color: #101010;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ETIQUETA DE VERSIÓN SOLICITADA */
        .version-tag {
            position: absolute;
            top: 15px;
            right: 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #555;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        h1 {
            color: #ffb300; /* Dorado más intenso */
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-size: 48px;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
        }

        p.subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        .book-card {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .book-card:hover {
            border-color: #ffb300;
            transform: translateY(-5px);
            background-color: #222;
        }

        .book-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 15px 0;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            overflow: hidden;
        }

        .cover-preview {
            width: 160px;
            height: 230px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 2px solid #000;
            background-color: #050505;
        }

        .btn {
            width: 100%;
            padding: 16px 0;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: block;
            background-color: #2e7d32;
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
            text-transform: uppercase;
        }

        .btn:active {
            box-shadow: 0 0 0 #1b5e20;
            transform: translateY(5px);
        }

        /* Texto de depuración por si falla */
        .debug-text {
            font-size: 10px;
            color: #555;
            margin-top: 5px;
            word-break: break-all;
            text-align: center;
            display: none; /* Se activa si hay error */
        }
    </style>
</head>
<body>

    <div class="version-tag">V03.0</div>
    <h1>🏛️ Biblioteca de VD</h1>
    <p class="subtitle">Sistema Reforzado: Auto-corrección de espacios y formatos</p>

    <div id="library-container"></div>

    <script>
        // ======================================================
        // ⚙️ ZONA DE CONFIGURACIÓN
        // ======================================================
        // INSTRUCCIÓN CLAVE: Copia el nombre EXACTO de GitHub.
        // Si tiene guiones Y espacios mezclados, ponlos tal cual.
        
        const misLibros = [
            // Libro 1 (El que funciona):
            "Los_suenos_de_los_que_esta_hecha_la_mate",

            // Libro 2 (El Kybalion):
            // SEGÚN TU FOTO, el nombre real en GitHub es:
            "Los ocho kybaliones_Gabriel Silva",
            
            // Si agregas más, asegúrate de que el nombre sea IDÉNTICO al del archivo
        ];

        // ======================================================
        // 🛡️ MOTOR V3.0 CON ITERACIONES DE RESCATE
        // ======================================================
        const container = document.getElementById('library-container');
        const pdfBase = `./pdf/`;
        const imgBase = `./portadas/`;

        misLibros.forEach(nombreCrudo => {
            // 1. Limpieza Visual (Solo para que se vea bonito el título)
            // Reemplaza guiones bajos por espacios para leerlo bien
            const tituloVisual = nombreCrudo.replace(/_/g, ' ');

            // 2. Blindaje de URL (Para el Link y la Imagen)
            // encodeURIComponent arregla los espacios y caracteres raros automáticamente
            const nombreSeguro = encodeURIComponent(nombreCrudo);
            
            // Rutas base (intentamos PNG primero)
            const rutaPDF = `${pdfBase}${nombreSeguro}.pdf`;
            const rutaImgPNG = `${imgBase}${nombreSeguro}.png`;
            const rutaImgJPG = `${imgBase}${nombreSeguro}.jpg`; // Ruta alternativa

            // Crear tarjeta
            const card = document.createElement('div');
            card.className = 'book-card';

            // 3. LOGICA DE IMAGEN INTELIGENTE
            // Creamos la imagen. Si falla PNG, el script intenta cargar JPG.
            const img = document.createElement('img');
            img.className = 'cover-preview';
            img.alt = tituloVisual;
            img.src = rutaImgPNG; // Intento 1: PNG

            // ITERACIÓN DE ERROR: Si falla el PNG...
            img.onerror = function() {
                // ...intenta cargar el JPG
                if (this.src.includes('.png')) {
                    console.log("PNG falló, intentando JPG para: " + nombreCrudo);
                    this.src = rutaImgJPG;
                } else {
                    // Si el JPG también falla, muestra imagen de error
                    this.onerror = null; // Evita bucle infinito
                    this.src = 'https://via.placeholder.com/160x230/222/555?text=Sin+Img';
                    // Muestra el nombre real para que el usuario sepa qué archivo falta
                    card.querySelector('.debug-text').style.display = 'block';
                }
            };

            card.appendChild(img);

            // Título y Botón
            const infoDiv = document.createElement('div');
            infoDiv.innerHTML = `
                <div class="book-title">${tituloVisual}</div>
                <a href="${rutaPDF}" class="btn" target="_self">📖 LEER</a>
                <div class="debug-text">Archivo buscado:<br>${nombreCrudo}</div>
            `;
            card.appendChild(infoDiv);

            container.appendChild(card);
        });
    </script>

</body>
</html>
