<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca del Servidor</title>
    <style>
        /* ESTILOS OPTIMIZADOS PARA MINECRAFT (WebDisplays) */
        body {
            background-color: #1a1a1a; /* Fondo oscuro para evitar brillo excesivo con Shaders */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffca28; /* Dorado estilo Minecraft */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 48px; /* Texto gigante para leerse desde lejos */
            text-shadow: 2px 2px 0px #000;
        }

        p.subtitle {
            font-size: 24px;
            color: #aaa;
            margin-bottom: 40px;
        }

        /* Contenedor de la cuadrícula de libros */
        #library-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); /* Tarjetas anchas */
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        /* Diseño de cada Tarjeta de Libro */
        .book-card {
            background-color: #2d2d2d;
            border: 4px solid #444;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .book-card:hover {
            border-color: #ffca28;
            transform: scale(1.02);
        }

        .book-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            height: 70px; /* Altura fija para alineación */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-preview {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 2px solid #000;
            background-color: #000;
        }

        /* BOTONES - La parte más importante para el Puntero Láser */
        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 20px; /* Zona de clic muy grande */
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            display: block;
        }

        /* Botón de Leer (Acción Principal) */
        .btn-read {
            background-color: #4CAF50; /* Verde */
            color: white;
            box-shadow: 0 4px 0 #2E7D32; /* Efecto 3D */
        }
        .btn-read:active {
            box-shadow: 0 0 0 #2E7D32;
            transform: translateY(4px);
        }

        /* Botón de Portada (Acción Secundaria) */
        .btn-cover {
            background-color: #2196F3; /* Azul */
            color: white;
            box-shadow: 0 4px 0 #1565C0;
        }
        .btn-cover:active {
            box-shadow: 0 0 0 #1565C0;
            transform: translateY(4px);
        }

    </style>
</head>
<body>

    <h1>🏛️ Biblioteca del Servidor</h1>
    <p class="subtitle">Usa el Puntero Láser (Clic Derecho) para interactuar</p>

    <div id="library-container">
        </div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURACIÓN: LISTA DE TUS LIBROS
        // ==========================================
        // Solo agrega el nombre del archivo AQUÍ (sin .pdf ni .png).
        // Asegúrate de que existan en las carpetas /pdf/ y /portadas/
        
        const misLibros = [
            "Los_suenos_de_los_que_esta_hecha_la_mate",
            "Los_ocho_kybaliones_Gabriel_Silva",
            // Agrega más libros aquí siguiendo el formato: "Nombre_Archivo",
        ];

        // ==========================================
        // 🤖 LÓGICA AUTOMÁTICA (NO TOCAR)
        // ==========================================
        const container = document.getElementById('library-container');
        const repoUser = "victordante19"; 
        const repoName = "Libros";
        
        // Base URLs
        const pdfBase = `./pdf/`;       // Ruta relativa para máxima compatibilidad
        const imgBase = `./portadas/`;  // Ruta relativa

        misLibros.forEach(nombreLibro => {
            // Limpiar nombre para mostrarlo bonito (reemplaza guiones bajos por espacios)
            const tituloLegible = nombreLibro.replace(/_/g, ' ');

            // Crear tarjeta HTML
            const card = document.createElement('div');
            card.className = 'book-card';

            card.innerHTML = `
                <img src="${imgBase}${nombreLibro}.png" alt="Portada" class="cover-preview" onerror="this.src='https://via.placeholder.com/150x220?text=Sin+Portada'">
                <div class="book-title">${tituloLegible}</div>
                <div class="btn-group">
                    <a href="${pdfBase}${nombreLibro}.pdf" class="btn btn-read" target="_self">📖 LEER</a>
                </div>
            `;

            container.appendChild(card);
        });
    </script>

</body>
</html>
